name: Update Nodes

on:
  schedule:
    - cron: "0 */8 * * *" # UTC 0/8/16 点 = 北京时间 08/16/24 点
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 mihomo 内核
        run: bash scripts/install_mihomo.sh

      - name: 抓取并合并最新节点
        id: fetch
        continue-on-error: true # 上游为空(退出码3)时跳过后续步骤但保持任务绿色
        env:
          GITHUB_TOKEN: ${{ github.token }} # api.github.com 抓取通道认证，提高限额
        run: python scripts/fetch_merge.py

      - name: 可用性过滤（mihomo 内核探测）
        id: check
        continue-on-error: true
        if: steps.fetch.outcome == 'success'
        run: python scripts/check_availability.py

      - name: 提交并推送
        if: steps.fetch.outcome == 'success' && steps.check.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "update: $(TZ=Asia/Shanghai date +'%F %T') 刷新可用节点"
            git push
          fi

name: Prescreen Nodes (foreign)

on:
  schedule:
    - cron: "10 */6 * * *" # 每 6 小时一次（北京时间 6:10 / 12:10 / 18:10 / 0:10）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prescreen-nodes
  cancel-in-progress: false

jobs:
  prescreen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 mihomo 内核
        run: bash scripts/install_mihomo.sh

      - name: 抓取上游候选
        id: fetch
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_merge.py

      - name: 国外初筛（单轮快速探测，砍掉明显不通的节点）
        id: prescreen
        continue-on-error: true
        if: steps.fetch.outcome == 'success'
        run: python scripts/prescreen.py

      - name: 提交初筛候选，供 CNB 国内复测
        if: steps.fetch.outcome == 'success' && steps.prescreen.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/candidates.yaml
          if git diff --cached --quiet; then
            echo "候选无变化，跳过提交"
          else
            git commit -m "prescreen: $(TZ=Asia/Shanghai date +'%F %T') 国外初筛候选"
            git pull --rebase origin main
            git push
          fi

# CNB 国内复测编排：GitHub Actions（国外）触发 CNB 短任务逐片复测。
# 触发：update.yml（国外初筛）完成后 + 每 6 小时定时。
# 流程：触发 CNB prepare（从 GitHub 拉初筛候选）→ 计算分片 → 并发触发 api_trigger_batch
#       → 轮询 get-build-status → 全部完成后 CNB 已发布最终订阅。
# 前置：仓库 Secret CNB_TOKEN（cnb.cool 访问令牌，repo-cnb-trigger 权限）。
name: cnb-retest
on:
  workflow_run:
    workflows: ["Prescreen Nodes (foreign)"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "40 */6 * * *" # 每 6 小时，比 prescreen 晚 30 分钟（兜底）
  workflow_dispatch: {}

env:
  CNB_REPO: lim12137/clash-node-pool
  BATCH_SIZE: "40"

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @cnbcool/cnb-cli

      - name: 触发 CNB prepare（从 GitHub 拉初筛候选）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          cnb build start-build --repo "$CNB_REPO" --branch main \
            --event api_trigger_prepare --title "prepare from prescreen"

      - name: 计算分片数
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/contents/output/candidates.yaml" \
            --jq .content | base64 -d | \
            python -c "import yaml,sys;d=yaml.safe_load(sys.stdin) or {};print(len(d.get('proxies') or []))")
          echo "pool=$COUNT"
          python - "$COUNT" >> "$GITHUB_OUTPUT" <<'PY'
          import math, os, sys
          count = int(sys.argv[1]); size = int(os.environ.get("BATCH_SIZE", "40"))
          print("batches=" + str(math.ceil(count / size)))
          PY

      - name: 触发全部分片复测
        if: steps.plan.outputs.batches > 0
        id: trigger
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          BATCHES: ${{ steps.plan.outputs.batches }}
        run: |
          SN_LIST=""
          for i in $(seq 0 $((BATCHES - 1))); do
            OUT=$(cnb build start-build --repo "$CNB_REPO" --branch main \
              --event api_trigger_batch --title "retest batch $i" \
              --env BATCH_SIZE="$BATCH_SIZE" --env BATCH_INDEX="$i")
            SN=$(echo "$OUT" | grep -m1 'sn:' | awk '{print $2}')
            echo "batch $i -> $SN"
            SN_LIST="$SN_LIST $SN"
          done
          echo "sns=$SN_LIST" >> "$GITHUB_OUTPUT"

      - name: 轮询分片结果
        if: steps.plan.outputs.batches > 0
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          SN_LIST: ${{ steps.trigger.outputs.sns }}
        run: |
          DONE=0; TOTAL=0
          for SN in $SN_LIST; do
            TOTAL=$((TOTAL+1))
            for t in $(seq 1 40); do
              sleep 15
              ST=$(cnb build get-build-status --repo "$CNB_REPO" --sn "$SN" | grep -m1 '^  status:' | awk '{print $2}')
              case "$ST" in
                success) echo "batch $SN DONE"; DONE=$((DONE+1)); break ;;
                error|cancel) echo "batch $SN $ST"; break ;;
              esac
            done
          done
          echo "completed $DONE / $TOTAL batches"
